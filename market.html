<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>マーケット・お助け広場 - 地域通貨</title>
    <style>
        body {
            background-color: #1e293b; /* 明るめの上品なダークトーン */
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 500px;
            width: 100%;
            padding: 20px 10px;
        }

        /* ヘルパー・ナビゲーションタブ */
        .nav-tabs {
            display: flex;
            justify-content: space-between;
            background-color: #334155;
            padding: 6px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .nav-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            color: #94a3b8;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .nav-tab.active {
            background-color: #0ea5e9;
            color: #ffffff;
        }

        /* ページタイトル */
        .page-header {
            margin-bottom: 20px;
            text-align: center;
        }

        .page-title {
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .page-subtitle {
            font-size: 0.9rem;
            color: #94a3b8;
        }

        /* 出品カードのリスト */
        .market-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
        }

        .market-card {
            background-color: #334155;
            border: 1px solid #475569;
            border-radius: 16px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-category {
            font-size: 0.75rem;
            background-color: #0ea5e9;
            color: #ffffff;
            padding: 3px 8px;
            border-radius: 6px;
            font-weight: bold;
        }

        .item-price {
            font-size: 1.1rem;
            font-weight: 800;
            color: #38bdf8;
        }

        .item-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #f8fafc;
        }

        .item-desc {
            font-size: 0.9rem;
            color: #cbd5e1;
            line-height: 1.5;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 5px;
            padding-top: 10px;
            border-top: 1px solid #475569;
            font-size: 0.85rem;
            color: #94a3b8;
        }

        /* LINEへ飛ぶボタン */
        .btn-line {
            background-color: #06c755; /* LINEカラー */
            color: #ffffff;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: opacity 0.2s;
        }

        .btn-line:hover {
            opacity: 0.9;
        }

        /* 新規出品ボタン */
        .btn-add {
            background-color: #0ea5e9;
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
        }

        .btn-add:hover {
            background-color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 上部ナビゲーションタブ -->
        <div class="nav-tabs">
            <a href="wallet.html" class="nav-tab">👛 ウォレット</a>
            <a href="market.html" class="nav-tab active">🛒 マーケット</a>
            <a href="index.html" class="nav-tab">🏠 ホーム</a>
        </div>

        <!-- ヘッダー -->
        <div class="page-header">
            <div class="page-title">お助け・品物広場</div>
            <div class="page-subtitle">不用品やお手伝いをシェアして循環させよう</div>
        </div>

        <!-- マーケット一覧（カード形式） -->
        <div class="market-list" id="market-list">
            <!-- デモ用の仮カード1 -->
            <div class="market-card">
                <div class="card-header">
                    <span class="item-category">モノ・不用品</span>
                    <span class="item-price">50 YENA</span>
                </div>
                <div class="item-title">まだ使えるコンパクト卓上IHヒーター</div>
                <div class="item-desc">一人暮らしで使っていたIHです。動作確認済み。取りに来てくれる方にお譲りします！</div>
                <div class="card-footer">
                    <span>出品者: タロウ</span>
                    <a href="https://line.me/R/ti/g/your_line_group_url" target="_blank" class="btn-line">💬 LINEで連絡する</a>
                </div>
            </div>

            <!-- デモ用の仮カード2 -->
            <div class="market-card">
                <div class="card-header">
                    <span class="item-category" style="background-color: #f59e0b;">お手伝い・技術</span>
                    <span class="item-price">100 YENA</span>
                </div>
                <div class="item-title">庭の草むしり・剪定お手伝い（1時間）</div>
                <div class="item-desc">春に向けてお庭のお手入れをお手伝いします。道具はこちらで持参します！</div>
                <div class="card-footer">
                    <span>出品者: 花子</span>
                    <a href="https://line.me/R/ti/g/your_line_group_url" target="_blank" class="btn-line">💬 LINEで連絡する</a>
                </div>
            </div>
        </div>

        <!-- 出品案内ボタン -->
        <button class="btn-add" onclick="openAddGuide()">＋ 新しく出品・投稿する</button>
    </div>

    <script>
        function openAddGuide() {
            alert('新しい出品は、コミュニティ用の「LINEグループ」に写真と詳細を投稿して完了となります！（後ほどスプレッドシート連動の仕組みを追加できます）');
        }
    </script>

</body>
</html>
