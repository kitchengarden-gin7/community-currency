<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ウォレット - 地域通貨</title>
    <style>
        body {
            background-color: #1e293b; /* 明るめの上品なダークトーン */
            color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            max-width: 500px;
            width: 100%;
            padding: 20px 10px;
        }

        /* ヘルパー・ナビゲーションタブ */
        .nav-tabs {
            display: flex;
            justify-content: space-between;
            background-color: #334155;
            padding: 6px;
            border-radius: 12px;
            margin-bottom: 25px;
        }

        .nav-tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            color: #94a3b8;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9rem;
            border-radius: 8px;
            transition: all 0.2s;
        }

        .nav-tab.active {
            background-color: #0ea5e9;
            color: #ffffff;
        }

        /* ユーザー情報カード */
        .user-card {
            background-color: #334155;
            border: 1px solid #475569;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }

        .user-name {
            font-size: 1.1rem;
            color: #cbd5e1;
            margin-bottom: 5px;
        }

        /* 残高をかなり大きく表示するエリア */
        .balance-box {
            margin: 15px 0;
        }

        .balance-title {
            font-size: 0.9rem;
            color: #94a3b8;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }

        .balance-amount {
            font-size: 3.5rem; /* かなり大きく迫力のあるサイズ */
            font-weight: 800;
            color: #38bdf8;
            line-height: 1.2;
        }

        .balance-unit {
            font-size: 1.2rem;
            font-weight: normal;
            color: #f8fafc;
            margin-left: 4px;
        }

        /* アクションボタン（送金・受取など） */
        .action-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 25px;
        }

        .btn {
            background-color: #0ea5e9;
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #38bdf8;
        }

        .btn-secondary {
            background-color: #334155;
            border: 1px solid #475569;
            color: #f8fafc;
        }

        .btn-secondary:hover {
            background-color: #475569;
        }

        /* 最近の履歴セクション */
        .history-section {
            background-color: #334155;
            border-radius: 16px;
            padding: 20px;
            border: 1px solid #475569;
        }

        .history-title {
            font-size: 1rem;
            margin-bottom: 12px;
            color: #cbd5e1;
            border-bottom: 1px solid #475569;
            padding-bottom: 8px;
        }

        .history-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 0.9rem;
            color: #94a3b8;
            text-align: center;
            padding: 10px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- 上部ナビゲーションタブ -->
        <div class="nav-tabs">
            <a href="wallet.html" class="nav-tab active">👛 ウォレット</a>
            <a href="market.html" class="nav-tab">🛒 マーケット</a>
            <a href="index.html" class="nav-tab">🏠 ホーム</a>
        </div>

        <!-- ウォレット本体カード -->
        <div class="user-card">
            <div class="user-name" id="display-username">読み込み中...さんのウォレット</div>
            
            <div class="balance-box">
                <div class="balance-title">現在の残高</div>
                <div class="balance-amount" id="balance-value">---<span class="balance-unit">YENA</span></div>
            </div>
        </div>

        <!-- 操作ボタン -->
        <div class="action-grid">
            <button class="btn" onclick="openSendModal()">📤 送金する</button>
            <button class="btn btn-secondary" onclick="openReceiveModal()">📥 受け取る</button>
        </div>

        <!-- 取引履歴 -->
        <div class="history-section">
            <div class="history-title">最近の取引履歴</div>
            <ul class="history-list" id="history-list">
                <li>まだ取引履歴はありません</li>
            </ul>
        </div>
    </div>

    <script>
        // 簡易的な名前の初期設定（localStorageを使用）
        window.addEventListener('DOMContentLoaded', () => {
            let username = localStorage.getItem('yena_username');
            
            if (!username) {
                username = prompt('あなたのお名前（メンバー名）を入力してください:', 'ゲスト');
                if (username) {
                    localStorage.setItem('yena_username', username);
                } else {
                    username = 'ゲスト';
                }
            }
            
            document.getElementById('display-username').textContent = username + ' さんのウォレット';
            
            // TODO: ここでスプレッドシート（GAS）からデータを取得する処理を繋ぎ込みます
            // 例: fetchDataFromGAS(username);
            
            // デモ用の仮の残高表示（後でGAS連携に置き換えます）
            setTimeout(() => {
                document.getElementById('balance-value').innerHTML = '150<span class="balance-unit">YENA</span>';
            }, 500);
        });

        function openSendModal() {
            alert('送金画面は次のステップで実装します！');
        }

        function openReceiveModal() {
            alert('受け取り（QRコード）画面は次のステップで実装します！');
        }
    </script>

</body>
</html>
