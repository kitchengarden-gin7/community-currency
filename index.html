<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YENA - 二人から始める地域通貨</title>
    <style>
        /* 全体のベース設定：濃紺と白文字 */
        body {
            background-color: #0b132b; /* 深い濃紺 */
            color: #ffffff;            /* 綺麗な白文字 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 10px;
            letter-spacing: 0.05em;
        }

        p.subtitle {
            font-size: 1.1rem;
            color: #8d99ae; /* 少し落ち着いたシルバーグレーで読みやすく */
            margin-bottom: 40px;
            line-height: 1.6;
        }

        /* 導線ボタンのスタイル */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            background-color: #1c2541;
            color: #ffffff;
            border: 1px solid #3a506b;
            padding: 18px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #3a506b;
            border-color: #5bc0be;
        }

        .btn-primary {
            background-color: #48bfe3;
            color: #0b132b;
            border: none;
        }
        
        .btn-primary:hover {
            background-color: #64dfdf;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>YENA</h1>
        <p class="subtitle">二人から始める、日本円に頼らないローカル・コミュニティ通貨。<br>時間、技術、不用品の循環をここから。</p>

        <div class="menu-grid">
            <!-- ウォレットへのリンク -->
            <a href="wallet.html" class="btn btn-primary">👛 ウォレットを開く（残高・送金）</a>
            
            <!-- マーケットへのリンク（LINE連携ベース） -->
            <a href="market.html" class="btn">🛒 マーケット・お助け広場</a>
            
            <!-- 管理者ガイドへのリンク -->
            <a href="admin.html" class="btn">⚙️ 管理者向け設定・ガイド</a>
        </div>
    </div>

</body>
</html>
