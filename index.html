<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二人から始める地域通貨</title>
    <style>
        /* 少し明るめで落ち着いたネイビー・ブルーグレー基調 */
        body {
            background-color: #1e293b; /* 明るめの上品なダークトーン（Slate系） */
            color: #f8fafc;            /* 柔らかい白文字 */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        
        .container {
            max-width: 600px;
            width: 100%;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 15px;
            letter-spacing: 0.03em;
            line-height: 1.4;
        }

        p.subtitle {
            font-size: 1.05rem;
            color: #cbd5e1; /* 読みやすい明るめのグレー */
            margin-bottom: 40px;
            line-height: 1.7;
        }

        /* 導線ボタンのスタイル */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            background-color: #334155;
            color: #f8fafc;
            border: 1px solid #475569;
            padding: 18px 20px;
            border-radius: 12px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: #475569;
            border-color: #38bdf8;
        }

        .btn-primary {
            background-color: #0ea5e9;
            color: #ffffff;
            border: none;
        }
        
        .btn-primary:hover {
            background-color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>二人から始める地域通貨</h1>
        <p class="subtitle">
            自分の好きな名前の通貨を作って、まずは身近なパートナーや友人と二人からスタート。<br>
            日本円を使わずに、時間、技術、不用品を循環させるローカル・エコノミーの扉を開こう。
        </p>

        <div class="menu-grid">
            <!-- ウォレットへのリンク -->
            <a href="wallet.html" class="btn btn-primary">👛 ウォレットを開く（残高・送金）</a>
            
            <!-- マーケットへのリンク（LINE連携ベース） -->
            <a href="market.html" class="btn">🛒 マーケット・お助け広場</a>
            
            <!-- 管理者ガイドへのリンク -->
            <a href="admin.html" class="btn">⚙️ 管理者向け設定・ガイド</a>
        </div>
    </div>

</body>
</html>
